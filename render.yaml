services:
  - type: web
    name: docsync-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @docsync/server build
    startCommand: pnpm --filter @docsync/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: docsync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docsync-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

  - type: redis
    name: docsync-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render services

  - type: web
    name: docsync-client
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @docsync/client build
    staticPublishPath: packages/client/dist
    envVars:
      - key: VITE_WS_URL
        sync: false

databases:
  - name: docsync-db
    plan: starter
