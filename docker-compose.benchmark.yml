# Isolated overlay for evidence runs. Invoke it only through scripts/benchmark
# so the project name, environment file, and artifact directory are recorded.
# It does not weaken the ordinary docker-compose.yml deployment defaults.
services:
  server-a:
    environment:
      GATEWAY_ID: server-a
      ALLOWED_ORIGINS: ${BENCHMARK_ALLOWED_ORIGIN:-http://localhost:${BENCHMARK_HTTP_PORT:-8080}}
      # The staged harness runs 25, 50, and 100-client phases against the same
      # disposable Redis volume.  A 500-point minute budget therefore covers
      # the 175 cumulative handshake attempts (plus one rerun) without
      # weakening the production compose defaults; message limiting remains on.
      WS_CONNECT_RATE_LIMIT_POINTS: 500
      HTTP_RATE_LIMIT_POINTS: 300
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1234/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]

  server-b:
    environment:
      GATEWAY_ID: server-b
      ALLOWED_ORIGINS: ${BENCHMARK_ALLOWED_ORIGIN:-http://localhost:${BENCHMARK_HTTP_PORT:-8080}}
      WS_CONNECT_RATE_LIMIT_POINTS: 500
      HTTP_RATE_LIMIT_POINTS: 300

  worker:
    environment:
      RUN_WORKERS: "true"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]

  lb:
    # Replace the ordinary host binding so this benchmark can coexist with
    # another local stack. nginx still listens on 8080 inside the network.
    ports: !override
      - "${BENCHMARK_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.benchmark.conf:/etc/nginx/nginx.conf:ro
