# Benchmark-only nginx configuration. It is mounted by
# docker-compose.benchmark.yml and preserves the same no-sticky-session
# upstream as production while allowing a single local generator to open its
# bounded 25/50/100-client stages without testing the perimeter limiter.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=benchmark_api:10m rate=200r/s;
  server_tokens off;

  upstream collab_servers {
    server server-a:1234;
    server server-b:1234;
  }

  server {
    listen 8080;

    location / {
      limit_req zone=benchmark_api burst=200 nodelay;
      proxy_pass http://collab_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 3600s;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
  }
}
