name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # Fast path: pg-mem and ioredis-mock, no services needed.
      - name: Run tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  integration:
    name: Tests on real Postgres + Redis
    runs-on: ubuntu-latest
    # The same suite as above, pointed at real services: exercises row
    # locking, advisory locks and SQL semantics pg-mem only approximates.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests against services
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/collab_test
          TEST_REDIS_URL: redis://localhost:6379/15

  docker-build:
    name: Validate server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This only proves the image builds — the compose stack (Postgres,
      # Redis, nginx, Prometheus/Grafana) isn't spun up here; that's a local/
      # manual verification step documented in docs/TESTING.md, not something
      # this pipeline runs on every push.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
