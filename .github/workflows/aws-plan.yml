name: Terraform

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - "scripts/deploy/aws-*.sh"
      - ".github/workflows/aws-plan.yml"
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "scripts/deploy/aws-*.sh"
      - ".github/workflows/aws-plan.yml"

permissions:
  contents: read

# Static checks only: no AWS credentials are configured here and nothing is
# planned or applied. Plans are an operator action (scripts/deploy/aws-plan.sh).
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check shell scripts
        working-directory: .
        run: bash -n scripts/deploy/aws-plan.sh scripts/deploy/aws-apply.sh scripts/deploy/aws-destroy.sh
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every accepted finding carries an inline #checkov:skip with its reason;
      # anything new fails the build.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/aws
          framework: terraform
          quiet: true
          soft_fail: false
